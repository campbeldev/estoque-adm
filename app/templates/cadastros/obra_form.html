{% extends "base.html" %}
{% set aba = 'cadastros' %}
{% block titulo %}{{ 'Editar obra' if obra else 'Nova obra' }}{% endblock %}
{% block conteudo %}
<h1 class="h4 mb-3">{{ 'Editar obra' if obra else 'Nova obra' }}</h1>
<div class="card">
  <div class="card-body">
    <form method="post" class="row g-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="col-md-6">
        <label class="form-label">Nome da obra *</label>
        <input class="form-control" name="nome" value="{{ obra.nome if obra else '' }}"
               autocomplete="off" spellcheck="false" required>
      </div>
      <div class="col-12">
        <button class="btn btn-primary">Salvar</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('cadastros.obras') }}">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
