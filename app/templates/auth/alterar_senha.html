{% extends "base.html" %}
{% block titulo %}Alterar senha{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm mt-4">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Alterar senha</h1>
        {% if obrigatoria %}
        <div class="alert alert-warning">
          Por segurança, troque a senha inicial antes de continuar.
        </div>
        {% endif %}
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="senha_atual">Senha atual</label>
            <input class="form-control" id="senha_atual" name="senha_atual" type="password" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="senha_nova">Nova senha</label>
            <input class="form-control" id="senha_nova" name="senha_nova" type="password" minlength="6" required>
            <div class="form-text">Mínimo de 6 caracteres.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="senha_confirmacao">Confirmar nova senha</label>
            <input class="form-control" id="senha_confirmacao" name="senha_confirmacao" type="password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Salvar nova senha</button>
          {% if not obrigatoria %}
          <a class="btn btn-outline-secondary w-100 mt-2" href="{{ url_for('auth.raiz') }}">Voltar</a>
          {% endif %}
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
